<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100">
  <defs>
    <linearGradient id="bsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623"/>
      <stop offset="50%" style="stop-color:#F07C2E"/>
      <stop offset="100%" style="stop-color:#E8453C"/>
    </linearGradient>
  </defs>
  <!-- Speed lines left -->
  <g opacity="0.7">
    <line x1="0" y1="30" x2="28" y2="30" stroke="url(#bsGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="5" y1="38" x2="30" y2="38" stroke="url(#bsGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="46" x2="32" y2="46" stroke="url(#bsGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="54" x2="34" y2="54" stroke="url(#bsGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="62" x2="30" y2="62" stroke="url(#bsGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="70" x2="28" y2="70" stroke="url(#bsGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- B letter -->
  <text x="35" y="72" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="72" font-style="italic" fill="url(#bsGrad)">B</text>
  <!-- S letter -->
  <text x="82" y="72" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="72" font-style="italic" fill="url(#bsGrad)">S</text>
  <!-- Speed lines right -->
  <g opacity="0.5">
    <line x1="135" y1="32" x2="160" y2="32" stroke="url(#bsGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="138" y1="40" x2="165" y2="40" stroke="url(#bsGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="136" y1="48" x2="170" y2="48" stroke="url(#bsGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="56" x2="168" y2="56" stroke="url(#bsGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="137" y1="64" x2="162" y2="64" stroke="url(#bsGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="142" y1="72" x2="158" y2="72" stroke="url(#bsGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- BESTAGE text -->
  <text x="35" y="95" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" letter-spacing="6" fill="#F5A623" opacity="0.8">BESTAGE</text>
</svg>
